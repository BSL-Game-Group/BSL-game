apiVersion: apps/v1
kind: Deployment
metadata:
  name: bsl-backend
  annotations:
    alpha.image.policy.openshift.io/resolve-names: "*"
    image.openshift.io/triggers: >
      [{"from":{"kind":"ImageStreamTag","name":"bsl-backend-service:staging"},"fieldPath":"spec.template.spec.containers[?(@.name==\"bsl-backend\")].image","pause":"false"},{"from":{"kind":"ImageStreamTag","name":"bsl-backend-service:staging"},"fieldPath":"spec.template.spec.initContainers[?(@.name==\"db-init\")].image","pause":"false"}]

spec:
  replicas: 1
  selector:
    matchLabels:
      app: bsl-backend

  template:
    metadata:
      labels:
        app: bsl-backend

    spec:
      initContainers:
        - name: db-init
          image: bsl-backend-service:staging
          imagePullPolicy: Always
          command: ["npm", "run", "db:init"]
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: bsl-backend-secret
                  key: DB_URL

      containers:
        - name: bsl-backend
          image: bsl-backend-service:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: bsl-backend-secret
                  key: DB_URL
            # The app signs session tokens with this and refuses to start without
            # it. Deliberately NOT marked `optional: true`: a missing key must
            # stop the rollout, not start a pod that cannot sign anyone in.
            #
            # The key MUST exist in bsl-backend-secret before this rolls out, or
            # the pod fails with CreateContainerConfigError. See README.md.
            # Not needed on the db-init initContainer, which only runs
            # sequelize-cli and never requires utils/token.js.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bsl-backend-secret
                  key: JWT_SECRET