apiVersion: apps/v1
kind: Deployment
metadata:
  name: bsl-backend-prod
  annotations:
    alpha.image.policy.openshift.io/resolve-names: "*"
    image.openshift.io/triggers: >
      [{"from":{"kind":"ImageStreamTag","name":"bsl-backend-service-prod:production"},"fieldPath":"spec.template.spec.containers[?(@.name==\"bsl-backend\")].image","pause":"false"},{"from":{"kind":"ImageStreamTag","name":"bsl-backend-service-prod:production"},"fieldPath":"spec.template.spec.initContainers[?(@.name==\"db-init\")].image","pause":"false"}]

spec:
  replicas: 1
  selector:
    matchLabels:
      app: bsl-backend-prod

  template:
    metadata:
      labels:
        app: bsl-backend-prod

    spec:
      initContainers:
        - name: db-init
          image: bsl-backend-service-prod:production
          imagePullPolicy: Always
          command: ["npm", "run", "db:init"]
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: bsl-backend-secret-prod
                  key: DB_URL
          resources:
            requests:
              memory: "50Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      containers:
        - name: bsl-backend
          image: bsl-backend-service-prod:production
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: bsl-backend-secret-prod
                  key: DB_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bsl-backend-secret-prod
                  key: JWT_SECRET
          resources:
            requests:
              memory: "50Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
